name: Build Android App
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK (Webview)
        run: |
          # Is baar hum kisi framework ka wait nahi karenge
          # Hum seedha ek lightweight Android project structure banayenge
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/
          
          # Basic Gradle build command (Ye fast hota hai)
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Files
        uses: actions/upload-artifact@v4
        with:
          name: RPS-Gods-App
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/bundle/release/*.aab
