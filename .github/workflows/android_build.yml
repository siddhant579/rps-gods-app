name: Build Android App
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android App
        uses: jmatsu/build-android-app-action@v1
        with:
          project-root: .
          # Ye action aapki index.html ko ek basic webview mein wrap kar dega
          # Bina bade frameworks ke load ke

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Game-APK
          path: ./**/*.apk

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: Game-AAB
          path: ./**/*.aab
