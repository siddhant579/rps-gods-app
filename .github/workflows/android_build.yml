name: Build Android App
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Webview Project
        run: |
          # Bina bade framework ke seedha folder structure banana
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/
          
          # Basic placeholder file build ke liye
          echo "Building APK and AAB..."

      - name: Build with Gradle Action
        uses: gradle/gradle-build-action@v2
        with:
          arguments: assembleRelease bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Game-APK
          path: "**/*.apk"

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: Game-AAB
          path: "**/*.aab"
